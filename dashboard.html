<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Prank Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0c10; color: #f1f5f9;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px; max-width: 680px; margin: 0 auto;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #1e293b;
  }
  h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 10px #22c55e; animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 50% { opacity: .4; } }
  .status-pill {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    background: #1e293b; color: #94a3b8;
  }
  .cards {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px;
  }
  .card {
    background: #131722; border: 1px solid #1e293b; border-radius: 16px; padding: 18px;
  }
  .card .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin-bottom: 8px; }
  .card .big { font-size: 42px; font-weight: 800; color: #ffd400; line-height: 1.05; }
  .card .sub { font-size: 13px; color: #64748b; margin-top: 6px; }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: #131722; border: 1px solid #1e293b; border-radius: 12px;
    padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    animation: slideIn .25s ease-out;
  }
  .item.highlight { border-color: #ffd400; background: #1c1917; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  .item-msg { font-size: 15px; font-weight: 600; }
  .item-meta { font-size: 12px; color: #64748b; text-align: right; white-space: nowrap; }
  .empty { text-align: center; padding: 36px 16px; color: #64748b; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span> Live Prank Dashboard</h1>
  <span class="status-pill" id="conn">Connecting...</span>
</header>

<div class="cards">
  <div class="card">
    <div class="label">Favorite Number Chosen</div>
    <div class="big" id="favNumDisplay">—</div>
    <div class="sub" id="favNumTime">Waiting for her to pick...</div>
  </div>
  <div class="card">
    <div class="label">Latest Stage</div>
    <div class="big" id="stageDisplay" style="font-size:24px;color:#39ff14">Waiting...</div>
    <div class="sub" id="deviceDisplay">No visits yet</div>
  </div>
</div>

<div id="log"><div class="empty" id="emptyMsg">Listening for live events... Open the link on a phone to test!</div></div>

<script>
(() => {
  const TOPIC = "dustin-meme-7c9e4a2b";
  const seen = new Set();
  const logEl = document.getElementById("log");
  const emptyMsg = document.getElementById("emptyMsg");
  const favNumDisplay = document.getElementById("favNumDisplay");
  const favNumTime = document.getElementById("favNumTime");
  const stageDisplay = document.getElementById("stageDisplay");
  const deviceDisplay = document.getElementById("deviceDisplay");
  const conn = document.getElementById("conn");

  function beep() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.08, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.18);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.2);
    } catch (e) {}
  }

  function handleLine(line, isLive) {
    if (!line) return;
    let env;
    try { env = JSON.parse(line); } catch (e) { return; }
    if (env.event !== "message" || !env.id || seen.has(env.id)) return;
    seen.add(env.id);

    let data;
    try { data = JSON.parse(env.message); } catch (e) { return; }
    if (!data || !data.step) return;

    if (emptyMsg) emptyMsg.remove();
    const timeStr = new Date((data.ts || env.time * 1000)).toLocaleTimeString();

    stageDisplay.textContent = data.text || data.step;
    if (data.device) deviceDisplay.textContent = `${data.device} • ${timeStr}`;

    if (data.favNum !== null && data.favNum !== undefined) {
      favNumDisplay.textContent = data.favNum;
      favNumTime.textContent = `Picked at ${timeStr} (${data.device || "Phone"})`;
    }

    const row = document.createElement("div");
    row.className = "item" + (data.step === "number_chosen" ? " highlight" : "");
    row.innerHTML = `
      <div class="item-msg">${data.text || data.step}</div>
      <div class="item-meta">${data.device || ""}<br>${timeStr}</div>
    `;
    logEl.prepend(row);
    if (isLive) beep();
  }

  // 1) Fetch cached history so you see past plays even if you open the dashboard afterwards
  fetch(`https://ntfy.sh/${TOPIC}/json?since=all&poll=1`)
    .then(r => r.text())
    .then(txt => txt.trim().split("\n").forEach(l => handleLine(l, false)))
    .catch(() => {});

  // 2) Subscribe to real-time SSE stream
  const es = new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
  es.onopen = () => { conn.textContent = "Live • Connected"; conn.style.color = "#22c55e"; };
  es.onmessage = e => handleLine(e.data, true);
  es.onerror = () => { conn.textContent = "Reconnecting..."; conn.style.color = "#eab308"; };
})();
</script>
</body>
</html>
